<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VC Game Studio</title>
  <link rel="stylesheet" href="css/studio.css">
</head>
<body>
  <header>
    <h1>VC Game Studio</h1>
    <p>Small games, made for the browser.</p>
  </header>
  <main>
    <div class="grid" id="games"></div>
  </main>
  <footer>&copy; <span id="year"></span> VC Game Studio</footer>
  <script>
    const games = [
      {
        title: "Star Dodge",
        description: "Steer your ship through an endless meteor field. How long can you survive?",
        path: "games/star-dodge/",
        tag: "Arcade",
      },
    ];
    const grid = document.getElementById("games");
    for (const g of games) {
      const a = document.createElement("a");
      a.className = "card";
      a.href = g.path;
      a.innerHTML = `<h2></h2><p></p><span class="tag"></span>`;
      a.querySelector("h2").textContent = g.title;
      a.querySelector("p").textContent = g.description;
      a.querySelector(".tag").textContent = g.tag;
      grid.appendChild(a);
    }
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
