# Packaging for Windows 10/11 and macOS, as VC Writer packages (its
# apps/desktop/electron-builder.yml). Signing credentials come from CI secrets
# and are never in the repository; see docs/DEPLOYMENT.md.
appId: com.vcgamestudio.desktop
productName: VC Game Studio
copyright: Copyright © VC Game Studio

directories:
  output: release
  buildResources: build

# Everything the app runs is bundled into out/ by electron-vite and there are
# no native modules, so there is nothing to install or rebuild. Skipping it
# also matters: in this npm workspace apps/studio has no node_modules of its
# own on a fresh CI checkout, and electron-builder's install step fails there.
npmRebuild: false

# 1024 px PNGs drawn by scripts/icons.mjs; electron-builder derives .ico and .icns.
icon: build/icon.png

files:
  - out/main/**
  - out/preload/**
  - out/renderer/**
  - package.json

# Installers go to the private gs-releases bucket (apps/web/scripts/publish-release.mjs)
# and are handed out as short-lived signed URLs; electron-builder publishes nothing.
publish: null

fileAssociations:
  - ext: vcgs
    name: VC Game Studio project
    role: Editor

win:
  target:
    - target: nsis
      arch: [x64]
  signingHashAlgorithms: [sha256]

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  createDesktopShortcut: true
  artifactName: VC-Game-Studio-Setup-${version}.${ext}

mac:
  icon: build/icon-mac.png
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: [universal]
  minimumSystemVersion: '11.0'
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist

dmg:
  artifactName: VC-Game-Studio-${version}.${ext}

# Notarization is switched on from the command line (-c.mac.notarize=true) only
# when Apple credentials are present, so an unsigned test build still works.
