name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Tests and the web builds never start Electron.
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Build the studio (desktop bundles, web, preview)
        run: |
          npm run build -w @vcgs/studio
          npm run build:web -w @vcgs/studio
          VCGS_EDITION=preview npm run build:web -w @vcgs/studio
      - name: Check the web bundles stay split
        run: node apps/studio/scripts/check-bundle.mjs
      - name: Validate example projects
        run: |
          for f in examples/*.game.json; do
            node packages/cli/dist/cli.js validate "$f"
            node packages/cli/dist/cli.js explore "$f"
          done

  godot:
    # The generated Godot code, run in a real Godot 4: every script and
    # resource loads, the lever works, the Vault Door scene plays through.
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Get Godot 4.3
        run: |
          curl -sSL -o godot.zip https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q godot.zip
          echo "GODOT=$PWD/Godot_v4.3-stable_linux.x86_64" >> "$GITHUB_ENV"
      - run: apps/studio/scripts/check-godot.sh

  unity:
    # The generated Unity runtime and keys compiled as C# 9 (warnings as
    # errors) against stubs of UnityEngine, then the sample story played with
    # it: the same walk as the Godot check.
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: npm ci
      - run: apps/studio/scripts/check-unity.sh

  unreal:
    # The generated Unreal plugin: its core built and run on the sample
    # (C++17, warnings as errors, no exceptions or RTTI) with gcc and clang,
    # every source compiled against stubs of Unreal's headers, the DataTable
    # import script byte-compiled and VCGS.Build.cs compiled.
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: npm ci
      - run: apps/studio/scripts/check-unreal.sh
      - run: CXX=clang++ apps/studio/scripts/check-unreal.sh
