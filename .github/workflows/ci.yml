name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Validate example projects
        run: |
          for f in examples/*.vcw.json; do
            node packages/cli/dist/cli.js validate "$f"
            node packages/cli/dist/cli.js explore "$f"
          done
